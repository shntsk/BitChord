name: webOS TV

on:
  push:
    branches: [main]
    paths:
      - "webos/**"
      - ".github/workflows/webos-ci.yml"
  pull_request:
    paths:
      - "webos/**"
      - ".github/workflows/webos-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webos-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  package:
    name: Build webOS IPK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install the official webOS CLI
        run: npm install --global @webos-tools/cli@3.2.6

      - name: Validate app metadata and JavaScript
        run: |
          python -m json.tool webos/app/appinfo.json > /dev/null
          node --check webos/app/js/app.js
          test -f webos/app/index.html
          test -f webos/app/icon.png
          test -f webos/app/largeIcon.png

      - name: Package webOS TV app
        working-directory: webos
        run: |
          ares -V
          ares-package ./app
          test -n "$(find . -maxdepth 1 -type f -name '*.ipk' -print -quit)"

      - name: Upload webOS IPK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-webOS-IPK
          path: webos/*.ipk
          if-no-files-found: error
          retention-days: 14
