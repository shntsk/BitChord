        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 /buildsrc
          cp -a "$GITHUB_WORKSPACE/." /buildsrc/source
          chown -R nobody:nobody /buildsrc
          mkdir -p "$GITHUB_WORKSPACE/dist"
          chown nobody:nobody "$GITHUB_WORKSPACE/dist"
          su nobody -s /bin/bash -c '
            set -euo pipefail
            cd /buildsrc/source/desktopApp/packaging/arch
            export BITCHORD_PKGVER="${{ steps.version.outputs.pkgver }}"
            makepkg --cleanbuild --nodeps --noconfirm --force
            cp -v ./*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
          '
          ls -lh dist

      - name: Validate package metadata and contents
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(find dist -maxdepth 1 -type f -name 'bitchord-*-x86_64.pkg.tar.zst' -print -quit)
          test -n "$pkg"
          pacman -Qip "$pkg"
          pacman -Qlp "$pkg" | grep -q '/opt/BitChord/bin/BitChord$'
          pacman -Qlp "$pkg" | grep -q '/opt/BitChord/lib/runtime/bin/java$'
          pacman -Qlp "$pkg" | grep -q '/usr/bin/bitchord$'
          pacman -Qlp "$pkg" | grep -q '/usr/share/applications/bitchord.desktop$'
          pacman -Qlp "$pkg" | grep -q '/usr/share/pixmaps/bitchord.png$'
          pacman -Qlp "$pkg" | grep -q '\.onnx$'
          pacman -Qlp "$pkg" | grep -q 'libbitchord_analysis\.so$'
          bsdtar -tf "$pkg" >/dev/null
          (cd dist && sha256sum "$(basename "$pkg")" > SHA256SUMS)

