name: Desktop CI

on:
  push:
    paths:
      - "desktopApp/**"
      - "desktopUi/**"
      - "shared/**"
      - "sharedUi/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktopApp/**"
      - "desktopUi/**"
      - "shared/**"
      - "sharedUi/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM tests and assemble the desktop app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :shared:jvmTest :desktopUi:jvmTest :desktopApp:test :desktopApp:createDistributable
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-linux-x64
          path: desktopApp/build/compose/binaries/main/app/BitChord/
          if-no-files-found: error

  windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM tests and assemble the desktop app
        run: .\gradlew.bat --no-daemon :shared:jvmTest :desktopUi:jvmTest :desktopApp:test :desktopApp:createDistributable
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-windows-x64
          path: desktopApp/build/compose/binaries/main/app/BitChord/
          if-no-files-found: error

  nixos:
    name: NixOS package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Lock flake inputs
        run: nix flake lock
      - name: Generate the Gradle dependency lock
        run: nix develop --command ./nix/update-deps.sh
      - name: Commit generated Nix locks when they changed
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock nix/deps.json
          if ! git diff --cached --quiet; then
            git commit -m "Add reproducible Nix dependency locks"
            git push origin "HEAD:$BRANCH"
          fi
      - name: Build the Nix package
        run: nix build .#default --print-build-logs
      - name: Verify the installed launcher and desktop entry
        run: |
          out="$(nix path-info .#default)"
          test -x "$out/bin/bitchord"
          test -f "$out/share/applications/bitchord.desktop"
          test -f "$out/share/icons/hicolor/512x512/apps/bitchord.png"
