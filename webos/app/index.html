<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101012">
  <title>BitChord TV</title>
  <link rel="stylesheet" href="css/tv.css">
</head>
<body>
  <main id="app" aria-label="BitChord for webOS">
    <header class="topbar">
      <div class="brand" aria-label="BitChord"><img src="brand-mark.svg" alt="BitChord"></div>
      <nav class="tabbar" aria-label="Main navigation">
        <button class="tab is-selected" type="button" data-tab="home" data-focus aria-current="page">Home</button>
        <button class="tab" type="button" data-tab="explore" data-focus>Explore</button>
        <button class="tab" type="button" data-tab="library" data-focus>Library</button>
        <span class="tab-divider" aria-hidden="true"></span>
        <button class="tab tab-wide" type="button" data-tab="now-playing" data-focus>Now Playing</button>
        <button class="tab tab-icon" type="button" data-tab="search" data-focus aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"></circle><path d="m16 16 4.2 4.2"></path></svg>
        </button>
        <button class="tab tab-icon" type="button" data-tab="settings" data-focus aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.1a3.9 3.9 0 1 0 0 7.8 3.9 3.9 0 0 0 0-7.8Z"></path><path d="m19.4 13.5 1.1.9-1.2 2.1-1.4-.5a7.5 7.5 0 0 1-1.7 1l-.2 1.5h-2.5l-.4-1.5a7.5 7.5 0 0 1-1.9 0l-.7 1.3-2.2-.9.2-1.5a7.5 7.5 0 0 1-1.3-1.5l-1.5.2-.9-2.3 1.2-.9a7.5 7.5 0 0 1 0-1.9l-1.2-.9.9-2.3 1.5.2a7.5 7.5 0 0 1 1.3-1.5l-.2-1.5 2.2-.9.7 1.3a7.5 7.5 0 0 1 1.9 0l.4-1.5h2.5l.2 1.5a7.5 7.5 0 0 1 1.7 1l1.4-.5 1.2 2.1-1.1.9a7.5 7.5 0 0 1 0 2.1Z"></path></svg>
        </button>
      </nav>
      <button class="account" type="button" data-focus aria-label="Account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"></circle><path d="M4.8 20c.7-3.6 3.2-5.4 7.2-5.4s6.5 1.8 7.2 5.4"></path></svg>
      </button>
    </header>

    <section id="home-screen" class="screen screen-home" aria-label="Home">
      <div class="feed" id="home-feed">
        <section class="shelf shelf-featured">
          <div class="shelf-heading"><h1>Made for You</h1></div>
          <div class="card-row featured-row">
            <button class="music-card featured-card" data-focus type="button" data-message="Your daily mix is part of the next playback integration."><span class="cover art-night"><span class="cover-orb"></span><span class="cover-label">01 <i>AFTER DARK</i></span></span><span class="card-title">After Dark</span><span class="card-subtitle">Your mix</span></button>
            <button class="music-card featured-card" data-focus type="button" data-message="Your daily mix is part of the next playback integration."><span class="cover art-blue"><span class="cover-orb"></span><span class="cover-label">02 <i>BLUE HOUR</i></span></span><span class="card-title">Blue Hour</span><span class="card-subtitle">Made for you</span></button>
            <button class="music-card featured-card" data-focus type="button" data-message="Your daily mix is part of the next playback integration."><span class="cover art-rose"><span class="cover-orb"></span><span class="cover-label">03 <i>SOFT FOCUS</i></span></span><span class="card-title">Soft Focus</span><span class="card-subtitle">Made for you</span></button>
            <button class="music-card featured-card" data-focus type="button" data-message="Your daily mix is part of the next playback integration."><span class="cover art-gold"><span class="cover-orb"></span><span class="cover-label">04 <i>GOLDEN</i></span></span><span class="card-title">Golden Hour</span><span class="card-subtitle">For the afternoon</span></button>
            <button class="music-card featured-card" data-focus type="button" data-message="Your daily mix is part of the next playback integration."><span class="cover art-violet"><span class="cover-orb"></span><span class="cover-label">05 <i>IN MOTION</i></span></span><span class="card-title">In Motion</span><span class="card-subtitle">Your mix</span></button>
          </div>
        </section>

        <section class="shelf">
          <div class="shelf-heading"><h2>Artists to Discover</h2></div>
          <div class="card-row artist-row">
            <button class="music-card artist-card" data-focus type="button" data-message="Artist pages will be connected to the BitChord catalog."><span class="cover artist-cover art-artist-1"><span class="artist-initial">A</span></span><span class="card-title">Aria Vale</span></button>
            <button class="music-card artist-card" data-focus type="button" data-message="Artist pages will be connected to the BitChord catalog."><span class="cover artist-cover art-artist-2"><span class="artist-initial">N</span></span><span class="card-title">NOVA</span></button>
            <button class="music-card artist-card" data-focus type="button" data-message="Artist pages will be connected to the BitChord catalog."><span class="cover artist-cover art-artist-3"><span class="artist-initial">M</span></span><span class="card-title">The Midnight</span></button>
            <button class="music-card artist-card" data-focus type="button" data-message="Artist pages will be connected to the BitChord catalog."><span class="cover artist-cover art-artist-4"><span class="artist-initial">L</span></span><span class="card-title">Luma</span></button>
            <button class="music-card artist-card" data-focus type="button" data-message="Artist pages will be connected to the BitChord catalog."><span class="cover artist-cover art-artist-5"><span class="artist-initial">Ø</span></span><span class="card-title">Nocturne</span></button>
            <button class="music-card artist-card" data-focus type="button" data-message="Artist pages will be connected to the BitChord catalog."><span class="cover artist-cover art-artist-6"><span class="artist-initial">S</span></span><span class="card-title">Solace</span></button>
          </div>
        </section>

        <section class="shelf">
          <div class="shelf-heading"><h2>Recently Played</h2></div>
          <div class="card-row recent-row">
            <button class="music-card recent-card" data-focus type="button" data-message="Playback will be connected in the next webOS milestone."><span class="cover art-coral"><span class="cover-orb"></span></span><span class="card-title">Slow Motion</span><span class="card-subtitle">Preview collection</span></button>
            <button class="music-card recent-card" data-focus type="button" data-message="Playback will be connected in the next webOS milestone."><span class="cover art-mint"><span class="cover-orb"></span></span><span class="card-title">Parallel</span><span class="card-subtitle">Preview collection</span></button>
            <button class="music-card recent-card" data-focus type="button" data-message="Playback will be connected in the next webOS milestone."><span class="cover art-plum"><span class="cover-orb"></span></span><span class="card-title">Velvet Skies</span><span class="card-subtitle">Preview collection</span></button>
            <button class="music-card recent-card" data-focus type="button" data-message="Playback will be connected in the next webOS milestone."><span class="cover art-ice"><span class="cover-orb"></span></span><span class="card-title">Orbit</span><span class="card-subtitle">Preview collection</span></button>
            <button class="music-card recent-card" data-focus type="button" data-message="Playback will be connected in the next webOS milestone."><span class="cover art-ember"><span class="cover-orb"></span></span><span class="card-title">Daydream</span><span class="card-subtitle">Preview collection</span></button>
          </div>
        </section>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div class="preview-note">WEBOS PORT · HOME UI PREVIEW · SAMPLE CONTENT</div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
