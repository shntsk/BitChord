<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101012">
  <title>BitChord</title>
  <link rel="stylesheet" href="css/tv.css">
  <link rel="stylesheet" href="css/live.css">
</head>
<body>
  <main id="app" aria-label="BitChord">
    <header class="topbar">
      <div class="brand" aria-label="BitChord"><img src="brand-mark.svg" alt="BitChord"></div>
      <nav class="tabbar" aria-label="Main navigation">
        <button class="tab is-selected" type="button" data-tab="home" data-focus aria-current="page">Home</button>
        <button class="tab" type="button" data-tab="explore" data-focus>Explore</button>
        <button class="tab" type="button" data-tab="library" data-focus>Library</button>
        <span class="tab-divider" aria-hidden="true"></span>
        <button class="tab tab-wide" type="button" data-tab="now-playing" data-focus>Now Playing</button>
        <button class="tab tab-icon" type="button" data-tab="search" data-focus aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.78l5 4.99L20.49 19l-4.99-5zm-5 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"></path></svg>
        </button>
        <button class="tab tab-icon" type="button" data-tab="settings" data-focus aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54A.49.49 0 0 0 13.87 2h-3.74a.49.49 0 0 0-.49.42L9.28 4.96c-.59.23-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.73 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.08.62-.08.94s.03.64.08.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.5.39 1.04.71 1.63.94l.36 2.54c.04.24.25.42.49.42h3.74c.24 0 .45-.18.49-.42l.36-2.54c.59-.23 1.13-.55 1.63-.94l2.39.96c.22.09.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.01-1.58zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"></path></svg>
        </button>
      </nav>
      <button class="account" type="button" data-focus aria-label="Account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
      </button>
    </header>

    <section id="screen-home" class="screen" data-screen="home" aria-label="Home"><div class="feed"></div></section>
    <section id="screen-explore" class="screen" data-screen="explore" aria-label="Explore" hidden><div class="feed"></div></section>
    <section id="screen-library" class="screen" data-screen="library" aria-label="Library" hidden><div class="feed"></div></section>

    <section id="screen-search" class="screen" data-screen="search" aria-label="Search" hidden>
      <div class="feed">
        <div class="search-bar">
          <input id="search-input" type="text" data-focus data-lead placeholder="Search songs and artists" autocomplete="off">
        </div>
        <div id="search-results"></div>
      </div>
    </section>

    <section id="screen-now-playing" class="screen" data-screen="now-playing" aria-label="Now Playing" hidden>
      <div class="feed np">
        <div class="np-art cover has-art art-night"><img id="np-art" alt=""></div>
        <div class="np-info">
          <h1 id="np-title">Nothing playing</h1>
          <p id="np-artist">Pick a song from Home or Search</p>
          <div class="np-bar"><div id="np-fill"></div></div>
          <div class="np-times"><span id="np-pos">0:00</span><span id="np-dur">0:00</span></div>
          <div class="np-controls">
            <button type="button" class="round-btn" id="np-prev" data-focus aria-label="Previous">&#9198;</button>
            <button type="button" class="round-btn round-big" id="np-play" data-focus aria-label="Play or pause">&#9654;</button>
            <button type="button" class="round-btn" id="np-next" data-focus aria-label="Next">&#9197;</button>
            <button type="button" class="round-btn" id="np-fav" data-focus aria-label="Favorite">&#9825;</button>
          </div>
        </div>
      </div>
    </section>

    <section id="screen-settings" class="screen" data-screen="settings" aria-label="Settings" hidden>
      <div class="feed">
        <div class="panel">
          <h2>Music server</h2>
          <p>Leave empty to use the built-in list of public Piped servers (tried in order).</p>
          <input id="set-instance" type="text" data-focus data-lead placeholder="https://pipedapi.example.com" autocomplete="off">
          <h2>Region</h2>
          <p>Two-letter country code used for Trending, e.g. US, BR, GB.</p>
          <input id="set-region" type="text" data-focus maxlength="2" placeholder="US" autocomplete="off">
          <div class="panel-actions">
            <button type="button" class="pill-btn" id="set-test" data-focus>Save &amp; test connection</button>
            <button type="button" class="pill-btn" id="set-clear" data-focus>Clear history</button>
          </div>
          <p id="set-status" class="panel-status"></p>
        </div>
      </div>
    </section>

    <audio id="audio" preload="auto"></audio>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
