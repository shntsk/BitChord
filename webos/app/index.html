<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101012">
  <title>BitChord</title>
  <link rel="stylesheet" href="css/tv.css">
</head>
<body>
  <main id="app" aria-label="BitChord">
    <header class="topbar">
      <div class="brand" aria-label="BitChord"><img src="brand-mark.svg" alt="BitChord"></div>
      <nav class="tabbar" aria-label="Main navigation">
        <button class="tab is-selected" type="button" data-tab="home" data-focus aria-current="page">Home</button>
        <button class="tab" type="button" data-tab="explore" data-focus>Explore</button>
        <button class="tab" type="button" data-tab="library" data-focus>Library</button>
        <span class="tab-divider" aria-hidden="true"></span>
        <button class="tab tab-wide" type="button" data-tab="now-playing" data-focus>Now Playing</button>
        <button class="tab tab-icon" type="button" data-tab="search" data-focus aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.78l5 4.99L20.49 19l-4.99-5zm-5 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"></path></svg>
        </button>
        <button class="tab tab-icon" type="button" data-tab="settings" data-focus aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54A.49.49 0 0 0 13.87 2h-3.74a.49.49 0 0 0-.49.42L9.28 4.96c-.59.23-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.73 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.08.62-.08.94s.03.64.08.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.5.39 1.04.71 1.63.94l.36 2.54c.04.24.25.42.49.42h3.74c.24 0 .45-.18.49-.42l.36-2.54c.59-.23 1.13-.55 1.63-.94l2.39.96c.22.09.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.01-1.58zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"></path></svg>
        </button>
      </nav>
      <button class="account" type="button" data-focus aria-label="Account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
      </button>
    </header>

    <section id="home-screen" class="screen screen-home" aria-label="Home">
      <div class="feed" id="home-feed">
        <section class="shelf shelf-featured">
          <div class="shelf-heading"><h1>Made for You</h1></div>
          <div class="card-row featured-row">
            <button class="music-card featured-card" data-focus type="button" data-message="Playback is not connected to the webOS interface yet."><span class="cover art-night"><span class="cover-orb"></span><span class="cover-label">01 <i>AFTER DARK</i></span></span><span class="card-title">After Dark</span><span class="card-subtitle">Your mix</span></button>
            <button class="music-card featured-card" data-focus type="button" data-message="Playback is not connected to the webOS interface yet."><span class="cover art-blue"><span class="cover-orb"></span><span class="cover-label">02 <i>BLUE HOUR</i></span></span><span class="card-title">Blue Hour</span><span class="card-subtitle">Made for you</span></button>
            <button class="music-card featured-card" data-focus type="button" data-message="Playback is not connected to the webOS interface yet."><span class="cover art-rose"><span class="cover-orb"></span><span class="cover-label">03 <i>SOFT FOCUS</i></span></span><span class="card-title">Soft Focus</span><span class="card-subtitle">Made for you</span></button>
            <button class="music-card featured-card" data-focus type="button" data-message="Playback is not connected to the webOS interface yet."><span class="cover art-gold"><span class="cover-orb"></span><span class="cover-label">04 <i>GOLDEN</i></span></span><span class="card-title">Golden Hour</span><span class="card-subtitle">For the afternoon</span></button>
            <button class="music-card featured-card" data-focus type="button" data-message="Playback is not connected to the webOS interface yet."><span class="cover art-violet"><span class="cover-orb"></span><span class="cover-label">05 <i>IN MOTION</i></span></span><span class="card-title">In Motion</span><span class="card-subtitle">Your mix</span></button>
          </div>
        </section>

        <section class="shelf">
          <div class="shelf-heading"><h2>Artists to Discover</h2></div>
          <div class="card-row artist-row">
            <button class="music-card artist-card" data-focus type="button" data-message="Artist pages are not connected to the webOS catalog yet."><span class="cover artist-cover art-artist-1"><span class="artist-initial">A</span></span><span class="card-title">Aria Vale</span></button>
            <button class="music-card artist-card" data-focus type="button" data-message="Artist pages are not connected to the webOS catalog yet."><span class="cover artist-cover art-artist-2"><span class="artist-initial">N</span></span><span class="card-title">NOVA</span></button>
            <button class="music-card artist-card" data-focus type="button" data-message="Artist pages are not connected to the webOS catalog yet."><span class="cover artist-cover art-artist-3"><span class="artist-initial">M</span></span><span class="card-title">The Midnight</span></button>
            <button class="music-card artist-card" data-focus type="button" data-message="Artist pages are not connected to the webOS catalog yet."><span class="cover artist-cover art-artist-4"><span class="artist-initial">L</span></span><span class="card-title">Luma</span></button>
            <button class="music-card artist-card" data-focus type="button" data-message="Artist pages are not connected to the webOS catalog yet."><span class="cover artist-cover art-artist-5"><span class="artist-initial">Ø</span></span><span class="card-title">Nocturne</span></button>
            <button class="music-card artist-card" data-focus type="button" data-message="Artist pages are not connected to the webOS catalog yet."><span class="cover artist-cover art-artist-6"><span class="artist-initial">S</span></span><span class="card-title">Solace</span></button>
          </div>
        </section>

        <section class="shelf">
          <div class="shelf-heading"><h2>Recently Played</h2></div>
          <div class="card-row recent-row">
            <button class="music-card recent-card" data-focus type="button" data-message="Playback history is not connected to the webOS account yet."><span class="cover art-coral"><span class="cover-orb"></span></span><span class="card-title">Slow Motion</span><span class="card-subtitle">Preview collection</span></button>
            <button class="music-card recent-card" data-focus type="button" data-message="Playback history is not connected to the webOS account yet."><span class="cover art-mint"><span class="cover-orb"></span></span><span class="card-title">Parallel</span><span class="card-subtitle">Preview collection</span></button>
            <button class="music-card recent-card" data-focus type="button" data-message="Playback history is not connected to the webOS account yet."><span class="cover art-plum"><span class="cover-orb"></span></span><span class="card-title">Velvet Skies</span><span class="card-subtitle">Preview collection</span></button>
            <button class="music-card recent-card" data-focus type="button" data-message="Playback history is not connected to the webOS account yet."><span class="cover art-ice"><span class="cover-orb"></span></span><span class="card-title">Orbit</span><span class="card-subtitle">Preview collection</span></button>
            <button class="music-card recent-card" data-focus type="button" data-message="Playback history is not connected to the webOS account yet."><span class="cover art-ember"><span class="cover-orb"></span></span><span class="card-title">Daydream</span><span class="card-subtitle">Preview collection</span></button>
          </div>
        </section>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
